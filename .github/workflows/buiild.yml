name: Sync and Build Rofi-Wayland

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:      
  push:
    branches: [ "wayland" ]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial for the sync to push back to your repo
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          ref: wayland
          fetch-depth: 0 # Fetches all history for a proper merge

      - name: Sync from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add the original creator as a remote
          git remote add upstream https://github.com/lbonn/rofi-wayland.git
          git fetch upstream master
          
          # Merge upstream/master into your current branch (wayland)
          git merge upstream/master --no-edit || echo "No changes or merge conflict"
          
          # Push changes back to your fork
          git push origin wayland

  build:
    needs: sync
    if: always() # Runs even if sync says "no changes"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: wayland
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build build-essential \
            libpango1.0-dev libstartup-notification0-dev libxcb-ewmh-dev \
            libxcb-icccm4-dev libxcb-randr0-dev libxcb-util0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libxcb-xrm-dev \
            libxcb-cursor-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgdk-pixbuf2.0-dev check flex bison libglib2.0-dev-bin \
            wayland-protocols libwayland-dev

      - name: Setup and Build
        run: |
          meson setup builddir . -Db_lto=true
          ninja -C builddir

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rofi-wayland-bin
          path: builddir/rofi
