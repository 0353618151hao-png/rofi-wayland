name: Sync and Build Rofi-Wayland

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:      # Allows manual trigger
  push:
    branches: [ "wayland" ]

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          ref: wayland
          fetch-depth: 0

      - name: Sync from Upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Syncs your 'wayland' branch with 'in0ni/rofi-wayland'
          gh repo sync ${{ github.repository }} --branch wayland --source in0ni/rofi-wayland --force

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build build-essential \
            libpango1.0-dev libstartup-notification0-dev libxcb-ewmh-dev \
            libxcb-icccm4-dev libxcb-randr0-dev libxcb-util0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libxcb-xrm-dev \
            libxcb-cursor-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libgdk-pixbuf2.0-dev check flex bison libglib2.0-dev-bin \
            wayland-protocols libwayland-dev

      - name: Setup and Build
        run: |
          git submodule update --init --recursive
          meson setup builddir . -Db_lto=true
          ninja -C builddir

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: rofi-wayland-bin
          path: builddir/rofi
